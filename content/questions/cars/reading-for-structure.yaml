chapter: reading-for-structure
passages:
  - id: cars-structure-p1
    title: "The Case for Ordinary Buildings"
    body: |
      Historic preservation has traditionally concerned itself with monuments: cathedrals, mansions, civic halls designed by celebrated architects. Under this model, a building earns protection by being exceptional, whether by its age, its designer or its association with some important event. The model has obvious virtues. It is legible, it is defensible before a skeptical city council, and it concentrates scarce public money where the public is most likely to agree that something irreplaceable is at stake. Yet I want to suggest that the monument model, for all its clarity, misunderstands what most people lose when a neighborhood is demolished.

      Consider what residents actually mourn. When a block of row houses or a corner shop disappears, the complaint is rarely that an architectural masterpiece has been destroyed. It is that a texture has been lost: the rhythm of doorways spaced to the pace of a walking person, the accumulated alterations (a bricked-up window, a storefront converted to a flat) that record how generations adapted the place to their needs. No single building in such a district would survive a monument test. The value lies in the ensemble, and in the evidence it offers of ordinary lives, which official history tends to record poorly if at all.

      Critics of broader preservation raise a serious objection, and it deserves more than a dismissive reply. Cities must change, they argue; housing must be built; and every protected block is a block where denser, cheaper dwellings cannot rise. On this view, extending protection to the ordinary turns preservation into a tool by which established homeowners freeze their surroundings and price out newcomers. There is evidence that this happens. Historic districts in a number of cities have coincided with rising rents, though whether designation causes the rise or merely follows a neighborhood already in demand is harder to establish than either side tends to admit.

      The objection, however, tells against a particular kind of preservation rather than against the principle. What critics rightly target is the treatment of a district as a finished artifact, where any change to a facade requires a hearing and new construction must imitate the old. But the very quality that makes ordinary buildings worth keeping, their record of adaptation, argues for permitting adaptation to continue. A rule that protected the scale and grain of a street while allowing additional stories set back from the front, or the division of single houses into several units, would keep what residents value without forbidding growth. Preserving a texture is not the same as embalming it.

      None of this makes the choice easy. Some neighborhoods will need to be rebuilt more thoroughly than any texture-based rule would permit, and some ordinary buildings are simply ordinary. Still, the question a city asks before demolition should not be only whether a building is exceptional. It should also be whether the street, taken as a whole, carries a memory that its replacement could not, and if so, whether the city can grow without erasing it.

  - id: cars-structure-p2
    title: "What the Score Leaves Out"
    body: |
      A musical score looks like a set of instructions, and it is natural to suppose that a faithful performance is simply one that carries the instructions out. The notes are to be played at the written pitch, for the written duration, at roughly the indicated speed and volume. Performers who depart from these markings are often accused of putting themselves ahead of the composer, and the accusation can sting precisely because it appeals to a widely shared ideal of fidelity.

      Yet the ideal rests on a picture of notation that few composers would have recognized. A score specifies some features of a performance with great precision and leaves others almost entirely open. Pitch is written exactly; the shaping of a phrase, the slight lingering before a resolution, the balance between voices in a chord, is written approximately or not at all. Composers of earlier centuries relied on performers to supply ornaments and sometimes whole passages, and they would have regarded a performance that played only what was on the page as incomplete rather than faithful. Notation, on this account, is less a blueprint than a set of constraints within which a performer is expected to make decisions.

      It does not follow that every decision is equally good. Some writers, eager to free performers from the tyranny of the page, have spoken as though the score were a mere suggestion, a starting point for whatever the performer happens to find expressive. This overcorrects. The constraints a score imposes are real, and many of the things it leaves unwritten were left unwritten because the composer could assume a shared practice: conventions about ornamentation, tempo and phrasing that musicians of the time absorbed in their training. Ignoring those conventions is not freedom from the composer; it is a failure to read what the composer took for granted.

      The difficulty is that such conventions must now be reconstructed, and the evidence for them is partial. It consists of treatises written by teachers who disagreed with one another, of letters and reviews, of the occasional copy annotated by a performer who knew the composer. Scholars can narrow the range of plausible choices, but they rarely reduce it to one. A performer who has studied the evidence carefully may still face a dozen defensible ways of shaping a single phrase, and nothing in the record will tell her which the composer preferred, or whether the composer had a preference at all.

      Fidelity, then, is better understood as a relation to a practice than to a text. A faithful performer is one who works within the space that the composer and the composer's contemporaries would have recognized as legitimate, and who chooses within that space with conviction. Two such performers may sound strikingly different, and both may be faithful. What neither may do is treat the space as limitless.

  - id: cars-structure-p3
    title: "Recording a Language"
    body: |
      Of the roughly seven thousand languages spoken in the world today, a substantial share, by some estimates as many as half, may cease to be learned by children within the coming century. The response of linguistics as a discipline has been largely documentary: to record speakers, to compile dictionaries and grammars, and to archive the results, so that a language will not be lost entirely even if it ceases to be spoken. Funding agencies have increasingly supported projects whose explicit aim is to capture as much of a language as possible before its last fluent speakers die.

      Documentation has its critics. A recorded language, they point out, is not a living one; an archive of transcribed stories is to a speech community roughly what a herbarium of pressed flowers is to a meadow. Worse, the documentary enterprise may console outsiders while doing little for the speakers themselves, who rarely asked to have their language stored on a university server and may never consult the result. Some critics go further, suggesting that the vocabulary of rescue casts linguists as the heroes of a story that properly belongs to the speakers. On this view, the money spent on documentation would be better directed to schools, broadcasting and other measures that give children reasons to speak the language now.

      There is truth in this critique, but it sets up a choice that communities themselves have often refused to make. Revitalization programs, where they have succeeded, have frequently drawn on documentary materials, sometimes materials made generations earlier by researchers with no thought of revival. A grammar compiled for academic readers can become the basis of a school curriculum; recordings of elders can supply pronunciations that no living speaker retains. The herbarium, it turns out, sometimes holds seeds.

      What the critique does establish is that documentation cannot be conducted as though speakers were merely sources of data. The most useful records are often those shaped by a community's own priorities: the songs people want their grandchildren to know, the vocabulary of practices that are fading, the relaxed conversational speech that formal elicitation of word lists and sentences tends to miss. Linguists who work in this way may produce less that is publishable in the short term, and the incentives of academic careers do not always reward that tradeoff. Some of the most valuable collections have been assembled by researchers who accepted slower careers in exchange for records a community could actually use.

      Neither documentation nor revitalization alone can guarantee that a language survives. Survival depends on whether people go on choosing to speak it, at home and in public, and no outside effort can compel that choice. But the two activities are less rivals than stages of a single project, and treating them as alternatives, as both enthusiasts and critics of documentation have sometimes done, risks impoverishing both.

  - id: cars-structure-p4
    title: "Promises to the Dead"
    body: |
      Suppose a friend, near death, asks you to scatter her ashes on a particular hillside, and you promise to do so. After her death you learn that the hillside is difficult to reach, and you begin to wonder whether the promise still binds you. She will never know whether you kept it. Many philosophers have found it hard to explain why that should matter, since on a common view an obligation is always owed to someone, and the dead are no longer anyone in particular. The puzzle is not merely academic: wills, memorials and the instructions people leave for their remains all presuppose that the wishes of the dead carry some weight.

      One response is to deny that the promise is owed to the dead person at all and to locate its force elsewhere. Keeping deathbed promises, on this account, sustains a practice from which the living benefit: knowing that our wishes will be honored allows us to face death with greater calm. The account is attractive because it requires no strange metaphysics, and it explains why societies enforce wills long after the people who wrote them are gone. But it makes the obligation oddly fragile. If I could keep my lapse entirely secret, so that the practice suffered no damage, the account seems to imply that I would have done nothing wrong, a conclusion that most people who have made such promises would reject.

      A second response holds that the dead can be wronged because some of their interests survive them. A person's interest in the success of her projects, or in the integrity of her reputation, does not seem to require that she be present to experience the outcome; we can be harmed, after all, by betrayals we never discover. If that is right, the promise remains owed to the friend herself, and breaking it frustrates an interest she really had.

      This view captures the intuition that the first one misses, but it purchases that success at a price. It requires us to say that events occurring after a person's death can make her life go better or worse, and some readers will find that claim difficult to accept. I am not certain it can be fully defended. Still, the alternative seems to me worse: an account on which a secret betrayal is no betrayal at all misdescribes what promising is.

      Perhaps the most that can be said is that our practice of promising was formed with the expectation that promisers would honor their commitments whether or not anyone could check, and that the dying friend extended her trust on exactly that understanding. Whether this amounts to an obligation owed to her, or merely one formed in relation to her, may matter less than philosophers have supposed. Either way, the hillside remains the place to go.

questions:
  # ---------- inline ----------
  - id: cars-structure-01
    usage: inline
    topic: CARS-RWT
    difficulty: intro
    stem: |
      Read the following excerpt from a book review.

      > Admittedly, the new translation smooths over passages that the original leaves deliberately rough, and some readers will miss that friction. But a translation that reproduced every roughness would be unreadable to the audience it was meant to reach, and the translator's choices here are, on the whole, defensible.

      The sentence beginning "Admittedly" functions primarily to:
    choices:
      A: "state the reviewer's central objection to the translation"
      B: "grant a limitation of the translation before defending it"
      C: "offer evidence that readers prefer smoother translations"
      D: "introduce a view that the reviewer goes on to reject entirely"
    answer: B
    explanation: |
      "Admittedly" is a concession keyword: the reviewer gives ground (the translation loses some deliberate roughness) and then pivots with "But" to the main claim that the translator's choices are defensible. The first sentence therefore concedes a limitation that the second sentence outweighs. Recognizing the concession-then-contrast pattern tells you the reviewer's overall verdict is positive but qualified.
    whyWrong:
      A: "Opposite: the concession is a minor point the reviewer outweighs; the central claim follows 'But' and is favorable."
      C: "Out of scope: the excerpt says some readers will miss the roughness; it offers no evidence about what readers prefer."
      D: "Extreme: the reviewer accepts the concession as true ('some readers will miss that friction') rather than rejecting it."

  - id: cars-structure-02
    usage: inline
    topic: CARS-FC
    difficulty: intro
    stem: |
      Read the following excerpt.

      > The early surveys of rural dialects were, in many respects, remarkable achievements, assembled by a handful of investigators traveling on foot. Their methods would not satisfy a modern sociolinguist: they favored elderly male speakers and treated variation as noise. Still, much of what we know about how these dialects once sounded we know because of them, and it would be ungracious to judge them only by standards they could not have known.

      The author's attitude toward the early dialect surveys is best described as:
    choices:
      A: "unqualified admiration for their methods and results"
      B: "dismissive skepticism about their lasting value"
      C: "detached indifference to their methods and results"
      D: "appreciation tempered by awareness of their limits"
    answer: D
    explanation: |
      The author praises the surveys ("remarkable achievements", "much of what we know... we know because of them") while acknowledging methodological flaws (they favored elderly men and treated variation as noise). The qualifier "in many respects" and the colon-introduced criticism show the praise is not total. The resulting tone is positive but measured, exactly the kind of mixed attitude CARS authors usually express.
    whyWrong:
      A: "Extreme: 'unqualified' ignores the explicit criticism that the methods would not satisfy a modern sociolinguist."
      B: "Opposite: the author calls the surveys remarkable and warns against judging them too harshly."
      C: "Unsupported: the author clearly cares, using evaluative words such as 'remarkable' and 'ungracious'; nothing signals indifference."

  - id: cars-structure-03
    usage: inline
    topic: CARS-FC
    difficulty: core
    passage: cars-structure-p1
    stem: |
      Which of the following best expresses the main idea of the passage?
    choices:
      A: "Historic districts raise rents, so they should be designated sparingly."
      B: "The monument model should be replaced by protection for ordinary neighborhoods."
      C: "Preservation should protect the texture of ordinary streets while letting them change."
      D: "Ordinary buildings deserve protection because many rival monuments in distinction."
    answer: C
    explanation: |
      The author argues that the monument model misses what residents lose (paragraph 1), supports this with the idea of texture (paragraph 2), answers the housing objection by distinguishing frozen preservation from adaptive preservation (paragraphs 3–4), and concludes that cities should ask about the whole street while still allowing growth (paragraph 5). Choice C captures both halves of this position: protect texture, and allow continued adaptation. Every paragraph supports it.
    whyWrong:
      A: "Wrong voice and overstated: this is the critics' concern, and the author says it is unclear whether designation causes rising rents."
      B: "Extreme: the author adds a criterion ('not be only whether a building is exceptional'); nothing says the monument model should be replaced."
      D: "Contradicts the passage: 'No single building in such a district would survive a monument test.' The value lies in the ensemble."

  - id: cars-structure-04
    usage: inline
    topic: CARS-RBT
    difficulty: core
    passage: cars-structure-p1
    stem: |
      A city council is considering four policies for a neighborhood of nineteenth-century row houses. Based on the passage, which policy would the author most likely support?
    choices:
      A: "Allowing houses to be split into apartments and to add recessed upper floors, while barring demolition of the street front"
      B: "Requiring all new construction in the neighborhood to replicate the materials and detailing of the existing houses"
      C: "Protecting only the oldest house on each block, so that the remaining lots can be redeveloped without review"
      D: "Suspending all new designations until research shows whether designation causes neighborhood rents to rise"
    answer: A
    explanation: |
      In paragraph 4 the author proposes exactly this kind of rule: one that protects "the scale and grain of a street" while allowing "additional stories set back from the front" and "the division of single houses into several units." Choice A keeps the texture (the street front) and permits growth, which is the balance the author's conclusion calls for.
    whyWrong:
      B: "Opposite: the author criticizes treating a district as a finished artifact where 'new construction must imitate the old.'"
      C: "Contradicts the passage: value lies in 'the ensemble', not in single exceptional buildings; this policy is the monument model in miniature."
      D: "Out of scope: the author notes causation is uncertain but never suggests halting designation until it is resolved."

  # ---------- quiz: passage 2 (music) ----------
  - id: cars-structure-05
    usage: quiz
    topic: CARS-FC
    difficulty: core
    passage: cars-structure-p2
    stem: |
      Which of the following best expresses the main idea of the passage?
    choices:
      A: "Performers should treat a score as a starting point for personal expression."
      B: "Faithful performance means playing exactly what the composer wrote on the page."
      C: "Evidence about past conventions is too contradictory to guide modern performers."
      D: "Fidelity means choosing confidently among the options a score and its practice allow."
    answer: D
    explanation: |
      The final paragraph states the author's conclusion with the keyword "then": fidelity is "a relation to a practice" rather than a text, and a faithful performer chooses "within that space with conviction." The earlier paragraphs build to this by rejecting both the literal view (paragraph 2) and the "mere suggestion" view (paragraph 3). Choice D restates the conclusion at the right scope.
    whyWrong:
      A: "Wrong voice: this is the view of the writers in paragraph 3, which the author says 'overcorrects.'"
      B: "Opposite: this is the conventional ideal the author challenges in paragraph 2 with 'Yet the ideal rests on a picture... few composers would have recognized.'"
      C: "Extreme: the author says scholars 'can narrow the range of plausible choices', so the evidence does guide performers, just not to a single answer."

  - id: cars-structure-06
    usage: quiz
    topic: CARS-FC
    difficulty: intro
    passage: cars-structure-p2
    stem: |
      According to the passage, which feature of a performance does a score specify most precisely?
    choices:
      A: "The pitch of each note"
      B: "The shaping of each phrase"
      C: "The balance between voices in a chord"
      D: "The ornaments added to the melody"
    answer: A
    explanation: |
      Paragraph 2 states directly: "Pitch is written exactly." By contrast, phrase shaping and the balance between voices are "written approximately or not at all", and ornaments were supplied by performers. This is a straightforward retrieval question; the answer is found by returning to the sentence that contrasts precise and open features.
    whyWrong:
      B: "Opposite detail: the passage lists phrase shaping among features 'written approximately or not at all.'"
      C: "Opposite detail: the balance between voices is in the same list of loosely notated features."
      D: "Contradicts the passage: composers 'relied on performers to supply ornaments', so ornaments were often not written at all."

  - id: cars-structure-07
    usage: quiz
    topic: CARS-RWT
    difficulty: core
    passage: cars-structure-p2
    stem: |
      The author mentions that historical treatises were "written by teachers who disagreed with one another" primarily in order to:
    choices:
      A: "suggest that historical treatises are unreliable and should be set aside"
      B: "show that earlier musicians shared no common conventions of performance"
      C: "explain why reconstructing past conventions narrows choices without settling them"
      D: "criticize scholars for failing to resolve conflicts in the historical record"
    answer: C
    explanation: |
      The detail appears in paragraph 4, which begins "The difficulty is that such conventions must now be reconstructed, and the evidence for them is partial." The disagreeing teachers are an example of that partiality, and the paragraph concludes that scholars "can narrow the range of plausible choices, but they rarely reduce it to one." The detail therefore supports the claim that evidence constrains but does not determine a performance.
    whyWrong:
      A: "Extreme: the author treats the treatises as useful evidence that narrows choices, not as something to discard."
      B: "Contradicts paragraph 3, which says composers 'could assume a shared practice'; disagreement about details does not mean no shared practice."
      D: "Out of scope: the author never blames scholars; the limits come from the evidence itself."

  - id: cars-structure-08
    usage: quiz
    topic: CARS-RWT
    difficulty: advanced
    passage: cars-structure-p2
    stem: |
      The author's attitude toward the writers described in paragraph 3, who speak of the score "as though [it] were a mere suggestion," is best characterized as:
    choices:
      A: "contempt for their disregard of composers' wishes"
      B: "sympathy with their aim but criticism of their conclusion"
      C: "full agreement, since they share the view that scores leave much open"
      D: "indifference, since their view has little bearing on the argument"
    answer: B
    explanation: |
      The author has already argued in paragraph 2 that a score is "less a blueprint than a set of constraints", so the author shares these writers' starting point that the page does not dictate everything. But the author then says their position "overcorrects": the constraints are real, and ignoring shared conventions is "a failure to read what the composer took for granted." To call something an overcorrection is to grant that there was something to correct, which is why B fits better than outright rejection.
    whyWrong:
      A: "Extreme: the tone is corrective ('This overcorrects'), not contemptuous; the author shares part of their view."
      C: "Half-right: the author agrees scores leave much open but explicitly rejects the conclusion that the score is a mere suggestion."
      D: "Contradicts the structure: paragraph 3 exists to distinguish the author's view from theirs, so their view matters to the argument."

  - id: cars-structure-09
    usage: quiz
    topic: CARS-RBT
    difficulty: core
    passage: cars-structure-p2
    stem: |
      One pianist preparing an eighteenth-century sonata adds improvised ornaments in the style described by teachers of that period. A second pianist adds harmonies borrowed from twentieth-century jazz. Based on the passage, the author would most likely say that:
    choices:
      A: "the first performance may be faithful, while the second exceeds the range of legitimate choices"
      B: "both performances are unfaithful, because each adds material the composer did not write down"
      C: "both performances may be faithful, because two faithful performers can sound strikingly different"
      D: "neither performance can be judged, because evidence about historical practice is only partial"
    answer: A
    explanation: |
      The author defines fidelity as working "within the space that the composer and the composer's contemporaries would have recognized as legitimate." Period-style ornaments fall within that space (composers "relied on performers to supply ornaments"), whereas jazz harmonies come from a practice the composer's contemporaries could not have recognized. The final sentence warns that no performer may "treat the space as limitless."
    whyWrong:
      B: "Opposite: the author says earlier composers would have regarded a performance with no added material as 'incomplete rather than faithful.'"
      C: "Half-right: different-sounding performances can both be faithful, but only if both stay within the legitimate space; the jazz version does not."
      D: "Extreme: partial evidence narrows the range of choices; it does not make all judgment impossible."

  # ---------- quiz: passage 3 (linguistics) ----------
  - id: cars-structure-10
    usage: quiz
    topic: CARS-FC
    difficulty: core
    passage: cars-structure-p3
    stem: |
      The author's central claim is that:
    choices:
      A: "documentation distracts from the real work of teaching endangered languages to children"
      B: "a language can survive indefinitely if it has been thoroughly recorded and archived"
      C: "documenting endangered languages and revitalizing them are complementary parts of one effort"
      D: "linguists should abandon formal elicitation and record only what communities choose"
    answer: C
    explanation: |
      The concluding paragraph states the thesis: documentation and revitalization "are less rivals than stages of a single project." Paragraph 3 supports it by showing that successful revitalization often drew on documentation, and paragraph 4 qualifies it by insisting that documentation serve community priorities. Choice C captures this complementary relationship.
    whyWrong:
      A: "Wrong voice: this is the critics' position in paragraph 2, which the author says 'sets up a choice that communities themselves have often refused to make.'"
      B: "Contradicts the passage: survival 'depends on whether people go on choosing to speak it'; a recorded language 'is not a living one.'"
      D: "Extreme: the author notes that formal elicitation misses conversational speech, but never says to abandon it."

  - id: cars-structure-11
    usage: quiz
    topic: CARS-FC
    difficulty: core
    passage: cars-structure-p3
    stem: |
      In the context of the passage, the statement "The herbarium, it turns out, sometimes holds seeds" (paragraph 3) most nearly means that:
    choices:
      A: "archived recordings are more useful to scientists than to the speakers themselves"
      B: "records made for study can sometimes help bring a language back into active use"
      C: "most endangered languages can be fully restored from their documentary records"
      D: "documentation is preferable to revitalization because its results last longer"
    answer: B
    explanation: |
      The critics compared an archive to a herbarium, a collection of dead specimens. The author turns the metaphor around: seeds can grow, just as academic grammars and old recordings have been used to teach and revive languages, as the preceding sentences describe. The qualifier "sometimes" limits the claim, which B preserves.
    whyWrong:
      A: "Opposite of the point: the sentence argues records can serve speakers, not that they mainly serve scientists."
      C: "Extreme: 'sometimes' becomes 'most', and 'help' becomes 'fully restored'; the author also says no outside effort can guarantee survival."
      D: "Out of scope: the author ranks neither activity above the other and calls them 'stages of a single project.'"

  - id: cars-structure-12
    usage: quiz
    topic: CARS-RWT
    difficulty: core
    passage: cars-structure-p3
    stem: |
      Which of the following claims is attributed in the passage to critics of documentation rather than asserted by the author?
    choices:
      A: "Revitalization programs have often relied on earlier documentary materials."
      B: "Academic incentives do not always reward community-centered documentation."
      C: "No outside effort can compel people to keep speaking a language."
      D: "Funding for documentation would do more good if spent on schools and broadcasting."
    answer: D
    explanation: |
      Paragraph 2 is entirely in the critics' voice ("they point out"; "On this view"), and it ends with the claim that money "would be better directed to schools, broadcasting and other measures." The author never endorses this redirection; paragraph 3 argues instead that the choice between documentation and revitalization is a false one. The other three claims appear in paragraphs 3, 4 and 5 in the author's own voice.
    whyWrong:
      A: "Author's voice: paragraph 3 makes this claim to rebut the critics."
      B: "Author's voice: paragraph 4 says 'the incentives of academic careers do not always reward that tradeoff.'"
      C: "Author's voice: the final paragraph states that 'no outside effort can compel that choice.'"

  - id: cars-structure-13
    usage: quiz
    topic: CARS-RBT
    difficulty: advanced
    passage: cars-structure-p3
    stem: |
      Which of the following findings, if true, would most seriously challenge the author's argument in paragraph 3?
    choices:
      A: "A survey of successful revitalization programs finds that almost none used earlier documentary materials."
      B: "A survey of several communities finds that many members have never consulted archived recordings."
      C: "A study finds that academic grammars are difficult for readers without linguistic training to use."
      D: "A study finds that children's use of a threatened language rises when schools begin to teach it."
    answer: A
    explanation: |
      Paragraph 3 rebuts the critics by claiming that successful revitalization programs "have frequently drawn on documentary materials." If almost none had done so, the main evidence that documentation and revitalization work together would collapse, and the critics' either/or framing would look more reasonable. A directly undermines the empirical premise of the author's reply.
    whyWrong:
      B: "True but irrelevant: this echoes the critics' point that speakers 'may never consult the result'; it does not touch paragraph 3's claim about revitalization programs."
      C: "Too weak: the author says a grammar 'can become' the basis of a curriculum, which is compatible with its being hard for nonspecialists to read directly."
      D: "Consistent with the passage: the author agrees revitalization matters; evidence that teaching works does not show documentation is useless to it."

  - id: cars-structure-14
    usage: quiz
    topic: CARS-RBT
    difficulty: core
    passage: cars-structure-p3
    stem: |
      A linguist is beginning fieldwork with a small community whose language is now spoken mainly by older residents. Which plan best reflects the approach the author recommends?
    choices:
      A: "Concentrating on formal word lists, because they yield publishable results most quickly"
      B: "Postponing all recording until the community has established language classes for children"
      C: "Recording the songs and everyday conversation that community members most want preserved"
      D: "Storing all recordings at a distant university so that they are protected from local loss"
    answer: C
    explanation: |
      Paragraph 4 says the most useful records are "shaped by a community's own priorities", naming "the songs people want their grandchildren to know" and "relaxed conversational speech that formal elicitation... tends to miss." Choice C applies that recommendation directly to the new situation.
    whyWrong:
      A: "Opposite: the author notes formal elicitation misses conversational speech and praises researchers who accept slower, less publishable work."
      B: "False choice: the author argues against treating documentation and revitalization as alternatives, and the elders' speech may not wait."
      D: "Opposite: storing records far away for outsiders echoes the critics' complaint about languages 'stored on a university server', and treats speakers as the author warns against, 'merely sources of data.'"

  # ---------- quiz: passage 4 (ethics) ----------
  - id: cars-structure-15
    usage: quiz
    topic: CARS-FC
    difficulty: core
    passage: cars-structure-p4
    stem: |
      Which of the following best describes the author's position on deathbed promises?
    choices:
      A: "They bind only because keeping them sustains a practice that comforts the dying."
      B: "They retain their force, though the best explanation of that force is uncertain."
      C: "They may be broken without wrongdoing if the breach is never discovered."
      D: "They bind because the dead can be harmed, a claim the author considers proven."
    answer: B
    explanation: |
      The author rejects the first account because it would excuse secret lapses, tentatively prefers the second while admitting "I am not certain it can be fully defended," and concludes that whether the obligation is owed "to her" or "in relation to her" matters less than supposed: "Either way, the hillside remains the place to go." The promise binds; the theory behind it remains open.
    whyWrong:
      A: "Wrong voice: this is the first response in paragraph 2, which the author criticizes as making the obligation 'oddly fragile.'"
      C: "Opposite: the author calls the idea that a secret betrayal is no betrayal a misdescription of promising."
      D: "Extreme: the author says, 'I am not certain it can be fully defended.'"

  - id: cars-structure-16
    usage: quiz
    topic: CARS-RWT
    difficulty: core
    passage: cars-structure-p4
    stem: |
      The author's principal objection to the account described in paragraph 2 is that it:
    choices:
      A: "depends on doubtful claims about events that occur after a person's death"
      B: "fails to explain how the living benefit from a practice of keeping promises"
      C: "assumes that a dying person would somehow learn whether the promise was kept"
      D: "implies that a promise broken in complete secrecy involves no wrongdoing"
    answer: D
    explanation: |
      After the "But" in paragraph 2, the author argues that the practice-based account makes the obligation "oddly fragile": if a lapse were kept secret so that the practice suffered no damage, "the account seems to imply that I would have done nothing wrong." That implication is the objection.
    whyWrong:
      A: "Misplaced: this is the price of the second view (paragraph 4); the first view is praised for needing 'no strange metaphysics.'"
      B: "Contradicts the passage: explaining the benefit to the living is exactly what the first account does."
      C: "Distortion: the account makes no such assumption; the friend 'will never know' is the premise of the whole puzzle."

