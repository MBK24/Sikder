    stem: |
      The author claims that "we can be harmed... by betrayals we never discover." Which situation would best illustrate this claim?
    choices:
      A: "A traveler loses her wallet and is distressed, though it is returned unopened the next day."
      B: "A student suspects a friend of spreading gossip about her, though no gossip occurred."
      C: "A scientist's collaborator secretly publishes her data as his own, and she never learns of it."
      D: "A worker is passed over for promotion and learns the unfair reason a year later."
    answer: C
    explanation: |
      The claim has two elements: a genuine betrayal, and the victim's never discovering it. Only C contains both. The collaborator betrays the scientist's interest in her work and reputation (the kind of surviving interest paragraph 3 names), and she never finds out.
    whyWrong:
      A: "Missing element: losing a wallet is not a betrayal, and the distress is experienced directly."
      B: "Missing element: no betrayal took place, so there is no undiscovered harm."
      D: "Missing element: the worker does discover the reason, so the harm is not undiscovered."
